<title>STATS</title>
<style>
@font-face{font-family:'mk';src:url(data:font/woff2;base64,) format('woff2')}.mk{font-family:'mk',cursive}
@font-face{font-family:'cv';src:url(data:font/woff2;base64,) format('woff2')}.cv{font-family:'cv',cursive}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.drip{transform-box:fill-box;transform-origin:50% 0;animation:drip 6s cubic-bezier(.5,0,.8,.6) infinite}
@keyframes drip{0%{transform:scaleY(.15)}70%{transform:scaleY(1)}86%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1.05);opacity:0}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 7s ease-out infinite}
@keyframes draw{0%{stroke-dashoffset:1;opacity:1}28%{stroke-dashoffset:0}88%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.flk{animation:flk 5s steps(1) infinite}@keyframes flk{0%,100%{opacity:1}90%{opacity:.35}92%{opacity:1}94%{opacity:.55}95%{opacity:1}}
.wig{transform-box:fill-box;transform-origin:50% 50%;animation:wig 3s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.pulse{animation:pls 2.4s ease-in-out infinite}@keyframes pls{50%{opacity:.25}}
.breathe{animation:br 4s ease-in-out infinite}@keyframes br{50%{opacity:.55}}
</style>
